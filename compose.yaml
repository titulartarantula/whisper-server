services:
  faster-whisper:
    build: .
    image: local/faster-whisper-diarize
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WHISPER__MODEL: deepdml/faster-whisper-large-v3-turbo-ct2
      WHISPER__INFERENCE_DEVICE: auto
      # The GPU is shared with LLMs and games, so both models leave it after 5 idle minutes and load
      # again on the next request (a few seconds). -1 keeps a model loaded.
      WHISPER__TTL: ${WHISPER_TTL:-300}
      DIARIZATION_TTL: ${DIARIZATION_TTL:-300}
      HF_TOKEN: ${HF_TOKEN:-}
      DIARIZATION_PRELOAD: ${DIARIZATION_PRELOAD:-0}
    volumes:
      - faster-whisper-cache:/root/.cache/huggingface
      # CUDA compiles kernels for this GPU on first use; keeping them makes the first request after a
      # restart as fast as the rest.
      - cuda-cache:/root/.nv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  cuda-cache:
  # Created by the original `docker run`; holds the downloaded Whisper and pyannote models.
  faster-whisper-cache:
    external: true
